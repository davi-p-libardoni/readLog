<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReadLog</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 36px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
        max-width: 640px;
        width: calc(100% - 48px);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
      }
      code {
        background: #f1f5f9;
        padding: 2px 6px;
        border-radius: 6px;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .links {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .chip {
        background: #e2e8f0;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>ReadLog</h1>
      <p>Your reading log API is running. Try the search endpoint:</p>
      <p><code>/book/search/quilting</code></p>
      <div class="links">
        <span class="chip">Status: OK</span>
        <a href="/book/search/quilting">Sample search</a>
      </div>
    </main>
  </body>
</html>
